<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>UWthesis — Compiled PDFs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="University of Warsaw thesis class — compiled PDF examples.">
  <style>
    :root { --fg: #111; --bg: #fff; --muted: #666; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
    body { font: 16px/1.55 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif;
           max-width: 760px; margin: 2.5rem auto; padding: 0 1rem; }
    header h1 { font-size: 1.8rem; margin: 0 0 .25rem; }
    header p  { margin: 0 0 1.25rem; color: var(--muted); }
    .card { border: 1px solid #ddd; padding: 1rem 1.25rem; border-radius: .5rem; margin: 1rem 0; }
    .list { list-style: none; margin: .5rem 0 0; padding: 0; }
    .list li { margin: .5rem 0; }
    a { color: inherit; text-decoration: underline; }
    footer { margin-top: 2rem; color: var(--muted); font-size: .9375rem; }
    code { background: #f5f5f5; padding: .1rem .3rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <header>
    <h1>UWthesis — compiled examples</h1>
    <p>Built from <code>mskrzypczak/UWthesis</code> via GitHub Actions.</p>
  </header>

  <section class="card">
    <h2>PDFs</h2>
    <ul class="list">
      <!-- Add your PDFs here -->
      <li><a href="thesis-demo.pdf">thesis-demo.pdf</a></li>
      <!-- Example of adding more PDFs later:
      <li><a href="chapter-template.pdf">chapter-template.pdf</a></li>
      <li><a href="polish-demo.pdf">polish-demo.pdf</a></li>
      -->
    </ul>
  </section>

  <footer>
    <div>University of Warsaw — Thesis class (black &amp; white)</div>
    <!-- Optionally replace this manually when you publish -->
    <div>Last updated: <time id="last-updated">PLACEHOLDER_DATETIME</time></div>
  </footer>
</body>
</html>
