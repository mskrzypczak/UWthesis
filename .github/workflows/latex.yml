name: "LaTeX: build & publish"

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare dist folder
        run: |
          sudo rm -rf dist || true
          mkdir -p dist
          sudo chown -R "$USER":"$USER" dist
          
          cp -r site/* dist/ || true

          DATE_PL=$(LC_ALL=pl_PL.UTF-8 date -u '+%Y-%m-%d %H:%M')
          sed -i "s|PLACEHOLDER_DATETIME|${DATE_PL}|" dist/index.html

      # Class, logos and examples in one folder: published as files and as a ZIP
      - name: Bundle the class with the examples
        run: |
          mkdir dist/uw-thesis
          cp LICENSE uw-thesis.cls UW_logo_*.pdf examples/*.tex examples/*.bib dist/uw-thesis/
          cd dist && zip -r uw-thesis.zip uw-thesis

      - name: Compile examples and manual with latex-action
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            examples/thesis-demo_EN.tex
            examples/thesis-demo_PL.tex
            manual.tex
          latexmk_use_lualatex: false
          latexmk_use_xelatex: false

      # Pictures of the pages and of the logo shown on the page
      - name: Convert three pages of the English example and the logo to PNG
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          for p in 1 2 10; do
            pdftoppm -png -scale-to-x 600 -scale-to-y -1 -f $p -l $p -singlefile dist/thesis-demo_EN.pdf dist/thesis-demo_EN-$p
          done
          pdftoppm -png -scale-to 112 -singlefile UW_logo_EN.pdf dist/logo

      # Make PDFs downloadable from the run page
      - name: Upload artifact (PDFs)
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/*.pdf

      # Prepare GitHub Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

